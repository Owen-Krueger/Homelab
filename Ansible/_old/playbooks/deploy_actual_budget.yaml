# Configures the container, adding a non-root user to use for SSH.
- name: Configure Actual Budget
  hosts: navidrome
  remote_user: root # root needs to be used initially to set up ansible user.
  gather_facts: true
  become: true
  become_user: root

  vars_files:
    - secrets.yaml

  vars:
    config_user: owen
    ansible_ssh_user: root

  roles:
    - configure_container

# Installs Navidrome and sets up the configuration.
- name: Setup Navidrome
  hosts: navidrome
  gather_facts: false

  vars_files:
    - secrets.yaml

  vars:
    navidrome_version: "0.59.0"

  roles:
    - navidrome_setup

