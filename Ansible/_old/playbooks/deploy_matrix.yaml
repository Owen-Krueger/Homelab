
# Configures the container, adding a non-root user to use for SSH.
- name: Configure Matrix
  hosts: matrix
  remote_user: root # root needs to be used initially to set up ansible user.
  gather_facts: true
  become: true
  become_user: root

  vars_files:
    - secrets.yaml

  vars:
    config_user: owen
    ansible_ssh_user: root

  roles:
    - configure_container

# Mounts the music NFS share. Because this is an unprivileged lxc, this
# must be done by creating a mount point, rather than letting the container
# mount the share itself.
- name: Mount NFS
  hosts: proxmox
  gather_facts: false

  tasks:
    - name: Create mount point for backup directory
      ansible.builtin.shell: pct set 115 -mp3 /mnt/truenas/backups,mp=/mnt/backups

# Installs Matrix Synapse and sets up the configuration.
- name: Setup Matrix
  hosts: matrix
  gather_facts: false
  vars:
    ansible_ssh_pipelining: true

  vars_files:
    - secrets.yaml

  roles:
    - matrix_setup

