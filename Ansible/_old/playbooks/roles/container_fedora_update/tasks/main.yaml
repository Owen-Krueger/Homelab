---
- name: Wait for container SSH to be available
  ansible.builtin.wait_for_connection:
    timeout: 60

- name: Upgrade all packages
  ansible.builtin.dnf:
    name: "*"
    state: latest

- name: Reboot if kernel updated
  ansible.builtin.reboot:
    msg: "Rebooting after kernel update"
  when: >
    (ansible_facts.get('pkg_mgr', '') == 'apt') and
    (ansible_facts.get('needs_reboot', false) | default(false))
