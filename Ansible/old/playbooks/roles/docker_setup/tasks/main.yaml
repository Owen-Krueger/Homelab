---
- name: apt update
  ansible.builtin.apt:
    update_cache: yes
  become: true

- name: Install packages
  ansible.builtin.apt:
    name:
    - ca-certificates
    - curl
  become: true

- name: Install keyrings
  ansible.builtin.shell: install -m 0755 -d /etc/apt/keyrings
  become: true

- name: Download Docker keyring
  ansible.builtin.shell: curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
  become: true

- name: Chmod keyring
  ansible.builtin.shell: chmod a+r /etc/apt/keyrings/docker.asc
  become: true

- name: Add repo to apt source
  ansible.builtin.shell: >
    tee /etc/apt/sources.list.d/docker.sources <<EOF
    Types: deb
    URIs: https://download.docker.com/linux/ubuntu
    Suites: $(. /etc/os-release && echo "${UBUNTU_CODENAME:-$VERSION_CODENAME}")
    Components: stable
    Signed-By: /etc/apt/keyrings/docker.asc
    EOF
  become: true

- name: Install Docker engine
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
