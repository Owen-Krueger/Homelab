---
- name: Ensure backup directory exist
  ansible.builtin.file:
    path: "/mnt/truenas/backups/{{ app_name }}/files"
    state: directory
    owner: "{{ item.owner | default('owen') }}"
    group: "{{ item.group | default('owen') }}"
    mode: '0755'

- name: Deploy directory backup service units
  ansible.builtin.template:
    src: dir-backup.service.j2
    dest: /etc/systemd/system/{{ app_name }}-{{ item.target_path }}-dir-backup.service
    mode: '0644'
  loop: "{{ directories }}"
  notify: Reload systemd
  become: true

- name: Deploy directory backup timer units
  ansible.builtin.template:
    src: dir-backup.timer.j2
    dest: /etc/systemd/system/{{ app_name }}-{{ item.target_path }}-dir-backup.timer
    mode: '0644'
  loop: "{{ directories }}"
  notify: Reload systemd
  become: true

- name: Enable and start timers
  ansible.builtin.systemd_service:
    name: "{{ app_name }}-{{ item.target_path }}-dir-backup.timer"
    state: started
    enabled: true
    daemon_reload: true
  loop: "{{ directories }}"
  become: true
