---
- name: Ensure backup directory exists
  ansible.builtin.file:
    path: "/mnt/truenas/backups/{{ app_name }}/files/{{ backup_target_directory }}"
    state: directory
    mode: '0755'

- name: Deploy directory backup service unit
  ansible.builtin.template:
    src: dir-backup.service.j2
    dest: /etc/systemd/system/{{ app_name }}-{{ backup_target_directory }}-dir-backup.service
    mode: '0644'
  notify: Reload systemd

- name: Deploy directory backup timer unit
  ansible.builtin.template:
    src: dir-backup.timer.j2
    dest: /etc/systemd/system/{{ app_name }}-{{ backup_target_directory }}-dir-backup.timer
    mode: '0644'
  notify: Reload systemd

- name: Enable and start timer
  ansible.builtin.systemd_service:
    name: "{{ app_name }}-{{ backup_target_directory }}-dir-backup.timer"
    state: started
    enabled: true
    daemon_reload: true
