---
- name: Ensure backup directory exists
  ansible.builtin.file:
    path: "/mnt/truenas/backups/{{ app_name }}/database"
    state: directory
    mode: '0755'

- name: Deploy pg-backup service unit
  ansible.builtin.template:
    src: pg-backup.service.j2
    dest: /etc/systemd/system/{{ app_name }}-pg-backup.service
    mode: '0644'
  become: true
  notify: Reload systemd

- name: Deploy pg-backup timer unit
  ansible.builtin.template:
    src: pg-backup.timer.j2
    dest: /etc/systemd/system/{{ app_name }}-pg-backup.timer
    mode: '0644'
  become: true
  notify: Reload systemd

- name: Enable and start timer
  ansible.builtin.systemd_service:
    name: "{{ app_name }}-pg-backup.timer"
    state: started
    enabled: true
    daemon_reload: true
  become: true
