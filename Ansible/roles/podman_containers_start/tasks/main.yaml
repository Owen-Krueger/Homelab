- name: Populate service facts
  ansible.builtin.service_facts:

- name: Stop {{ service_name }}
  ansible.builtin.systemd_service:
    name: '{{ service_name }}'
    scope: user
    state: stopped
  #when: "'{{ service_name}}.service' in services"
  when: service_name in services

- name: Restart user daemon
  ansible.builtin.systemd_service:
    daemon_reload: true
    scope: user

- name: Start {{ service_name }}
  ansible.builtin.systemd_service:
    name: '{{ service_name }}'
    state: started
    enabled: true
    scope: user
