---
# Configures the container, adding a non-root user to use for SSH.
- name: Configure Navidrome
  hosts: navidrome
  remote_user: root # root needs to be used initially to set up ansible user.
  gather_facts: true
  become: true
  become_user: root

  vars:
    config_user: owen
    ansible_ssh_user: root

  roles:
    - ubuntu_setup

# Mounts the music NFS share. Because this is an unprivileged lxc, this
# must be done by creating a mount point, rather than letting the container
# mount the share itself.
- name: Mount NFS
  hosts: proxmox
  gather_facts: false

  tasks:
    - name: Create mount point for music directory
      ansible.builtin.shell: pct set {{ container_number }} -mp2 /mnt/truenas/music,mp=/mnt/music

- name: Setup backup
  hosts: navidrome
  gather_facts: false

  roles:
    - backup_setup

# Installs Navidrome and sets up the configuration.
- name: Setup Navidrome
  hosts: navidrome
  gather_facts: false

  roles:
    - navidrome_setup

