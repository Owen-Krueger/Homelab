---
- name: Update services
  hosts: authentik
  gather_facts: false

  vars:
    containers:
      - service_name: postgresql
        service_image: '{{ authentik_database_image }}'
      - service_name: redis
        service_image: '{{ authentik_redis_image }}'
      - service_name: server
        service_image: '{{ authentik_server_image }}'
      - service_name: worker
        service_image: '{{ authentik_server_image }}'

  roles:
    - authentik_copy_services # This is necessary, because some of the containers have hardcoded SHAs, so this makes sure we push the new one to the server.
    - podman_containers_update
